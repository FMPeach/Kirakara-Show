name: Show DLL 构建测试

on:
  workflow_dispatch:
  push:
    branches: [main, Actions-Test]
    paths: [config/actions-build.json]

permissions:
  contents: read

concurrency:
  group: show-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: 编译 DLL 并验证
        shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = (Join-Path $env:MSYS2_LOCATION 'ucrt64/bin') + ';' + $env:PATH
          .\tools\build-actions-artifact.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kirakara-show-windows-x64
          path: build/actions-test/artifact/
          if-no-files-found: error
          retention-days: 7
